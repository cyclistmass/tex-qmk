name: flasher

# One-file tex_flash for Windows (tex_flash.exe) and macOS, all with PyInstaller --onefile, for the release assets.
# Each runner builds for its own CPU: macos-15 is Apple silicon (arm64), macos-15-intel is Intel (x86_64).
# The result is not signed or notarized: macOS blocks it on first run until the user picks Open from the
# Finder's right-click menu (or runs xattr -d com.apple.quarantine tex_flash).
on:
  push:
    paths:
      - shinobi/tools/**
      - .github/workflows/flasher.yml
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x86-64
            out: tex_flash.exe
          - runner: macos-15
            arch: arm64
            out: tex_flash_macos_arm64
          - runner: macos-15-intel
            arch: x86_64
            out: tex_flash_macos_x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Flasher tests (no keyboard, fake hidapi)
        run: python -I shinobi/tools/tests/test_flasher.py
      - name: Install PyInstaller and hidapi
        run: python -m pip install -q pyinstaller hidapi
      - name: Package
        # hid is imported inside a function, so PyInstaller has to be told about it.
        run: |
          python -m PyInstaller --onefile --clean --name tex_flash \
            --paths shinobi/tools --hidden-import hid shinobi/tools/tex_flash.py
          exe=dist/tex_flash; [ -f dist/tex_flash.exe ] && exe=dist/tex_flash.exe
          file "$exe"
          file "$exe" | grep -q "${{ matrix.arch }}"
          echo "EXE=$exe" >> "$GITHUB_ENV"
      - name: Smoke test (starts, names itself, carries hidapi)
        run: |
          ./$EXE --help | tee help.txt
          grep -Eq "^usage: tex_flash(\.exe)? " help.txt
          # hid is only imported once a keyboard is looked for, so check the archive as well as a run.
          pyi-archive_viewer --list --recursive $EXE > contents.txt
          grep -E "(^|[^a-z_])hid([^a-z_]|$)" contents.txt
      - name: Smoke test (opens the USB HID layer, finds no keyboard)
        # A runner has no keyboard, so a real flash can't run here. This loads hidapi inside the packaged file,
        # enumerates USB HID devices for TEX's vendor ID, and must stop with the no-keyboard message.
        run: |
          python -I -c "import sys; sys.path.insert(0, 'shinobi/tools/tests'); import test_flasher as t; open('img.bin', 'wb').write(t.good_image())"
          set +e
          ./$EXE img.bin --lang en > run.txt 2>&1
          code=$?
          set -e
          cat run.txt
          test "$code" -ne 0
          grep -q "no USB keyboard in the bootloader or the firmware" run.txt
      - name: Name by CPU
        run: |
          mkdir out
          cp "$EXE" "out/${{ matrix.out }}"
          python -I -c "import hashlib,sys; p=sys.argv[1]; print(hashlib.sha256(open(p,'rb').read()).hexdigest(), p)" "out/${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/${{ matrix.out }}
