name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# The toolchain is pinned to the one the released firmware was built and tested with: Ubuntu 24.04's
# gcc-arm-none-eabi 13.2.rel1 and QMK CLI 1.2.0. The ghcr.io/qmk/qmk_cli image moves (gcc 15.2 in 2026-11),
# and a different compiler makes a different image that has not been tested on a keyboard.
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        keymap: [default]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the editor check unpacks the release tag's sources
      - name: Install the pinned toolchain
        run: |
          # The runner's Azure Ubuntu mirror has hung or failed DNS here (2026-11-11); use the main archive.
          grep -rlZ azure.archive.ubuntu.com /etc/apt | xargs -0r sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $apt update -q
          $apt install -y -q gcc-arm-none-eabi=15:13.2.rel1-2 binutils-arm-none-eabi libnewlib-arm-none-eabi
          python3 -m venv "$RUNNER_TEMP/qmkenv"
          "$RUNNER_TEMP/qmkenv/bin/pip" install -q qmk==1.2.0
          echo "$RUNNER_TEMP/qmkenv/bin" >> "$GITHUB_PATH"
          arm-none-eabi-gcc --version | head -1
      - name: Build against the pinned QMK commit
        run: |
          shinobi/tools/build_firmware.sh "$RUNNER_TEMP/qmk_firmware" ${{ matrix.keymap }}
          cp "$RUNNER_TEMP/qmk_firmware/.build/tex_shinobi_${{ matrix.keymap }}.bin" .
      - uses: actions/upload-artifact@v4
        with:
          name: tex_shinobi_${{ matrix.keymap }}
          path: tex_shinobi_${{ matrix.keymap }}.bin
      # The keymap editor patches the release image, so it is checked against the release's own sources: the
      # editor's export of the default keymap must compile to the release, and a patched image to its own build.
      - uses: actions/setup-node@v4
        if: matrix.keymap == 'default'
        with:
          node-version: 22
      - name: Keymap editor byte-identity check
        if: matrix.keymap == 'default'
        run: shinobi/editor/test/ci_check.sh "$RUNNER_TEMP/qmk_firmware" "$RUNNER_TEMP/editor_check"
