name: flasher-macos

# One-file tex_flash for macOS, packaged the way tex_flash.exe is on Windows (PyInstaller --onefile).
# Each runner builds for its own CPU: macos-14 is Apple silicon (arm64), macos-13 is Intel (x86_64).
# The result is not signed or notarized: macOS blocks it on first run until the user picks Open from the
# Finder's right-click menu (or runs xattr -d com.apple.quarantine tex_flash).
on:
  push:
    paths:
      - shinobi/tools/**
      - .github/workflows/flasher-macos.yml
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Flasher tests (no keyboard, fake hidapi)
        run: python3 -I shinobi/tools/tests/test_flasher.py
      - name: Install PyInstaller and hidapi
        run: python3 -m pip install -q pyinstaller hidapi
      - name: Package
        # hid is imported inside a function, so PyInstaller has to be told about it.
        run: |
          python3 -m PyInstaller --onefile --clean --name tex_flash \
            --paths shinobi/tools --hidden-import hid shinobi/tools/tex_flash.py
          file dist/tex_flash
          file dist/tex_flash | grep -q "${{ matrix.arch }}"
      - name: Smoke test (starts, prints usage, loads hidapi)
        run: |
          ./dist/tex_flash --help
          python3 - <<'PY'
          import subprocess, sys
          # A missing hid module shows up as an import error the first time the tool looks for the keyboard;
          # with no keyboard attached the run must end with the tool's own "not found" message instead.
          r = subprocess.run(["./dist/tex_flash", "--lang", "en", "/dev/null"], capture_output=True, text=True)
          out = r.stdout + r.stderr
          print(out)
          sys.exit(1 if ("No module named" in out or "Traceback" in out) else 0)
          PY
      - name: Name by CPU
        run: |
          mkdir out
          cp dist/tex_flash "out/tex_flash_macos_${{ matrix.arch }}"
          shasum -a 256 out/*
      - uses: actions/upload-artifact@v4
        with:
          name: tex_flash_macos_${{ matrix.arch }}
          path: out/tex_flash_macos_${{ matrix.arch }}
