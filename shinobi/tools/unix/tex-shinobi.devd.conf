# TEX Shinobi BLE5 (Holtek 04D9): let members of the group "texflash" flash it, without root and without setuid.
# UNTESTED on FreeBSD. Install as root:
#   pw groupadd texflash && pw groupmod texflash -m YOURNAME     (log in again afterwards)
#   cp tex-shinobi.devd.conf /usr/local/etc/devd/tex-shinobi.conf && service devd restart
# then unplug and replug the keyboard. See README.md in this folder.
#
# 0407 is the firmware, 1407 is TEX's bootloader (IAP). The match is on vendor and product, so no other
# device is touched. The group is dedicated: "operator" can also read disks, so it is not used here.

# uhid(4) nodes
attach 100 {
	device-name "uhid[0-9]+";
	match "vendor" "0x04d9";
	match "product" "0x(0407|1407)";
	action "chgrp texflash /dev/$device-name; chmod 0660 /dev/$device-name";
};

# hidraw(4) nodes (FreeBSD 13 and later; the hid stack names them like this)
attach 100 {
	device-name "hidraw[0-9]+";
	match "vendor" "0x04d9";
	match "product" "0x(0407|1407)";
	action "chgrp texflash /dev/$device-name; chmod 0660 /dev/$device-name";
};
